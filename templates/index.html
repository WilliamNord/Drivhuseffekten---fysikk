<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>Klimamodel</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f0f4f8;
            padding: 40px;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 500px;
            margin: auto;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }

        h1 {
            color: #1b4f72;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        button {
            background-color: #2874a6;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #1f618d;
        }

        .resultat {
            margin-top: 30px;
            background: #eaf2f8;
            padding: 20px;
            border-radius: 8px;
        }
    </style>

</head>
<body>

<div class="container">

    <h1>Simulering av drivhuseffekten</h1>

    <form method="POST">

        <label>Albedo (0-1)</label>
        <input type="number" step="0.01" name="albedo" value="0.30">

        <label>Drivhuseffekt ε (0-1): <span id="epsilon-verdi">{{ epsilon }}</span></label>
        <input type="range" name="epsilon" value="{{ epsilon }}" min="0" max="1" step="0.01" oninput="document.getElementById('epsilon-verdi').innerText = this.value">

        <button type="submit">Beregn temperatur</button>

    </form>

    {% if temp_uten is not none %}

    <div class="resultat">

        <h2>Resultater</h2>

        <p>
            Temperatur uten atmosfære:
            <strong>{{ temp_uten|round(1) }} °C</strong>
        </p>

        <p>
            Temperatur med drivhuseffekt:
            <strong>{{ temp_med|round(1) }} °C</strong>
        </p>

    </div>

    {% endif %}

</div>

</body>
</html>
